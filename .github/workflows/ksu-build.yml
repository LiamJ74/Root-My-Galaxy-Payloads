name: KernelSU

# Compiles the KernelSU half of the payloads: the kernel module and `ksud`, each with the Samsung
# patch applied to the tag the patch names.
#
# This exists because a rebase cannot be checked on every machine it is prepared on. The module needs
# a DDK container, and `ksud` needs `libclang` for bindgen and an AArch64 assembler for its LKM
# bootstrap - none of which a Windows laptop with an Android NDK reliably has (the NDK ships
# `clang.exe` but not the libclang shared library). A runner has all of it.
#
# It builds the patch, it does not publish anything. The module built here carries the DDK's own
# UTS_RELEASE rather than a target's, so it is a compile check, not an installable artifact. See
# docs/KERNELSU-3.3.0-UPGRADE.md for what publishing one involves.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Which flavour to build'
        required: true
        type: choice
        options:
          - kernelsu
          - kernelsu-next
        default: kernelsu
      ksu_ref:
        description: 'Tag to build (needs a matching kernelsu/patches/<name>-<ref>-*.patch)'
        required: true
        default: 'v3.3.0'
      ddk_release:
        description: 'DDK image release'
        required: true
        default: '20260828'
      kmi:
        description: 'KMIs for the kernel module, as a JSON array'
        required: true
        default: '["android15-6.6","android14-6.1"]'
      # The two inputs below turn this from a compile check into a pair that can be served by the
      # feed: the module has to name the target's own kernel release, and `ksud` has to embed it.
      # Leave the release empty to skip those jobs.
      target_id:
        description: 'Target id for the publishable pair, e.g. pa3q-S938USQSCCZF9'
        required: false
        default: ''
      target_release:
        description: 'The target''s exact kernel release, as `uname -r` reports it'
        required: false
        default: ''
      pair_kmi:
        description: 'KMI for the pair build'
        required: false
        default: 'android15-6.6'
  push:
    # Only what changes the build. Documentation edits used to re-run this too, pulling four DDK
    # images to recompile an identical module; prose about the build is not the build.
    paths:
      - 'kernelsu/patches/**'
      - '.github/workflows/ksu-build.yml'

permissions:
  contents: read

env:
  FLAVOR: ${{ github.event.inputs.flavor || 'kernelsu' }}
  # The two flavours live in different repositories and their tags only happen to share a name, so
  # the repository, the patch and the artifact names all follow the flavour rather than being fixed.
  FLAVOR_REPO: ${{ (github.event.inputs.flavor || 'kernelsu') == 'kernelsu-next' && 'KernelSU-Next/KernelSU-Next' || 'tiann/KernelSU' }}
  FLAVOR_PATCH: ${{ (github.event.inputs.flavor || 'kernelsu') == 'kernelsu-next' && 'KernelSU-Next' || 'KernelSU' }}
  # Distinguishes the files this flavour publishes from the other flavour's, so both can be served
  # for one target without either clobbering the other.
  FLAVOR_SUFFIX: ${{ (github.event.inputs.flavor || 'kernelsu') == 'kernelsu-next' && '-next' || '' }}
  KSU_REF: ${{ github.event.inputs.ksu_ref || 'v3.3.0' }}
  PATCH: kernelsu/patches/${{ (github.event.inputs.flavor || 'kernelsu') == 'kernelsu-next' && 'KernelSU-Next' || 'KernelSU' }}-${{ github.event.inputs.ksu_ref || 'v3.3.0' }}-samsung-kdp-rkp-defex.patch

jobs:
  # ---------------------------------------------------------------------------------------------
  # `ksud`: the userspace half. The Rust edits live here, so this is where a bad merge of the
  # `install`/`finish_install` split or a stale import shows up.
  # ---------------------------------------------------------------------------------------------
  ksud:
    name: ksud (${{ github.event.inputs.flavor || 'kernelsu' }}, ${{ github.event.inputs.ksu_ref || 'v3.3.0' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payloads
        uses: actions/checkout@v7

      - name: Check the patch exists for this ref
        run: |
          if [ ! -f "${{ env.PATCH }}" ]; then
            echo "::error::No patch for ref ${{ env.KSU_REF }}: expected ${{ env.PATCH }}"
            echo "Present patches:"
            ls -1 kernelsu/patches/ || true
            exit 1
          fi
          echo "Building against ${{ env.KSU_REF }} with ${{ env.PATCH }}"

      - name: Checkout KernelSU
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FLAVOR_REPO }}
          ref: ${{ env.KSU_REF }}
          path: KernelSU
          # `ksud`'s build script derives VERSION_CODE from `git describe`. A shallow, tagless clone
          # makes it warn and fall back to 0.0.0, which is not what a real build stamps.
          fetch-depth: 0
          fetch-tags: true

      - name: Point the suspended Kernel-SU dependencies at KernelSU2
        run: |
          # The `Kernel-SU` organisation is suspended, so its git dependencies 404. Upstream's own
          # fix is tiann/KernelSU#3723, which repoints them at the successor org `KernelSU2`. The
          # revs are deliberately *not* bumped here: the lockfile's revs are the ones this tag and
          # this patch are consistent with (main pins a different ksu_props).
          #
          # Both flavours need this, and they lay their manifests out differently - KernelSU has one
          # workspace lockfile at its root, KernelSU-Next has one per crate - so find them rather
          # than naming them.
          cd KernelSU
          mapfile -t manifests < <(find . -name Cargo.toml -o -name Cargo.lock | grep -v '/target/')
          echo "manifests: ${#manifests[@]}"
          sed -i 's#github\.com/Kernel-SU/#github.com/KernelSU2/#g' "${manifests[@]}"
          grep -rn 'github.com/Kernel-SU/' "${manifests[@]}" || echo "no Kernel-SU references left"

      - name: Apply the Samsung patch
        run: git -C KernelSU apply --verbose "$GITHUB_WORKSPACE/${{ env.PATCH }}"

      - name: Rust target
        run: rustup target add aarch64-linux-android

      - name: Android NDK
        run: |
          curl -sSLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-r28c" >> "$GITHUB_ENV"

      - name: libclang for bindgen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev
          # The runner already carries LLVM; ask it where, rather than guessing a version directory.
          clanglib=$(llvm-config --libdir 2>/dev/null || true)
          if [ -z "$clanglib" ] || [ ! -e "$clanglib/libclang.so" ]; then
            clanglib=$(dirname "$(find /usr/lib/llvm-* -name 'libclang.so*' -printf '%p\n' 2>/dev/null | head -1)")
          fi
          echo "LIBCLANG_PATH=$clanglib" >> "$GITHUB_ENV"
          echo "libclang: $clanglib"

      - name: Cargo config for the NDK
        run: |
          if [ -f KernelSU/scripts/setup_cargo_config.py ]; then
            python3 KernelSU/scripts/setup_cargo_config.py --ndk-root "$ANDROID_NDK_HOME" --force
          else
            # KernelSU-Next carries neither that script nor a `.cargo/` template, so the config it
            # would have generated is written here instead. Pinned to the NDK this workflow
            # downloads: linux-x86_64 host, API 26. Only the aarch64 target is configured because
            # that is the only one either flavour is built for.
            ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
            mkdir -p KernelSU/.cargo
            cat > KernelSU/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$ndk/bin/aarch64-linux-android26-clang"

          [env]
          CC_aarch64_linux_android = "$ndk/bin/aarch64-linux-android26-clang"
          CXX_aarch64_linux_android = "$ndk/bin/aarch64-linux-android26-clang++"
          AR_aarch64_linux_android = "$ndk/bin/llvm-ar"
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "--sysroot=$ndk/sysroot -I$ndk/sysroot/usr/include/aarch64-linux-android"
          EOF
          fi
          cat KernelSU/.cargo/config.toml

      - name: Build ksud
        run: |
          # The NDK's bin has to be on PATH: `ksud`'s build script assembles its AArch64 LKM
          # bootstrap with the first of `aarch64-linux-gnu-gcc`, `clang`, `llvm-mc` it finds.
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd KernelSU
          cargo build --release --locked --target aarch64-linux-android -p ksud

      - name: Report what was stamped
        run: |
          cd KernelSU
          echo "git describe: $(git describe --tags 2>/dev/null || echo '(none)')"
          file target/aarch64-linux-android/release/ksud
          ls -l target/aarch64-linux-android/release/ksud

      - name: Upload ksud
        uses: actions/upload-artifact@v7
        with:
          name: ksud-${{ env.KSU_REF }}-aarch64
          path: KernelSU/target/aarch64-linux-android/release/ksud
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # The kernel module. Built twice per KMI: with live text patching, and with
  # CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y, because the no-patch-text guard is one of the hunks a
  # rebase has to re-place by hand.
  # ---------------------------------------------------------------------------------------------
  module:
    name: module (${{ github.event.inputs.flavor || 'kernelsu' }}, ${{ matrix.kmi }}, ${{ matrix.no_patch_text && 'no-patch-text' || 'patch-text' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJSON(github.event.inputs.kmi || '["android15-6.6","android14-6.1"]') }}
        no_patch_text: [false, true]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ github.event.inputs.ddk_release || '20260828' }}
      options: --privileged
    steps:
      - name: Checkout payloads
        uses: actions/checkout@v7

      - name: Check the patch exists for this ref
        run: |
          if [ ! -f "${{ env.PATCH }}" ]; then
            echo "::error::No patch for ref ${{ env.KSU_REF }}: expected ${{ env.PATCH }}"
            ls -1 kernelsu/patches/ || true
            exit 1
          fi

      - name: Checkout KernelSU
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FLAVOR_REPO }}
          ref: ${{ env.KSU_REF }}
          path: KernelSU

      - name: Apply the Samsung patch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/KernelSU"
          git -C KernelSU apply --verbose "$GITHUB_WORKSPACE/${{ env.PATCH }}"

      - name: Build kernelsu.ko
        run: |
          cd KernelSU/kernel
          # The DDK's release is not a target's, so this module is a compile check, not something to
          # install. Substituting the target release is a per-profile step - see kernelsu/README.md.
          CONFIG_KSU=m \
          CONFIG_KSU_SAMSUNG_KDP=y \
          CONFIG_KSU_SAMSUNG_RKP=y \
          CONFIG_KSU_SAMSUNG_DEFEX=y \
          ${{ matrix.no_patch_text && 'CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y' || '' }} \
          CC=clang make -j"$(nproc)"

          echo "=== built ==="
          ls -l kernelsu.ko
          modinfo ./kernelsu.ko
          # Keeps the symbol tables the manual-relocation loader needs.
          llvm-strip -d kernelsu.ko
          echo "after strip:"; ls -l kernelsu.ko

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v7
        with:
          name: kernelsu-${{ env.KSU_REF }}-${{ matrix.kmi }}-${{ matrix.no_patch_text && 'no-patch-text' || 'patch-text' }}
          path: KernelSU/kernel/kernelsu.ko
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # The publishable pair, for one target.
  #
  # A module the feed can serve has to report the *target's* kernel release: these devices run
  # `CONFIG_MODULE_FORCE_LOAD=n`, so a module naming the DDK's own release is refused by the loader
  # rather than merely discouraged. `ksud` then has to embed that module, because the daemon the app
  # downloads is the thing that loads it.
  #
  # This is not the whole bar the 3.2.5 artifacts met. `kernel/check_symbol` and the relocation audit
  # want the target's recovered `vmlinux`, which is not in this repository; what runs here instead is
  # the import diff below, against the module that is already device-tested on the same kernel build.
  # ---------------------------------------------------------------------------------------------
  pair-module:
    name: pair module (${{ github.event.inputs.flavor || 'kernelsu' }}, ${{ github.event.inputs.target_id }})
    # The event name has to be part of this: on a push there are no inputs, and `null != ''` is true,
    # which would otherwise run the pair with an empty target.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_release != ''
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ github.event.inputs.pair_kmi || 'android15-6.6' }}-${{ github.event.inputs.ddk_release || '20260828' }}
      options: --privileged
    steps:
      - name: Checkout payloads
        uses: actions/checkout@v7

      - name: Check the patch exists for this ref
        run: |
          if [ ! -f "${{ env.PATCH }}" ]; then
            echo "::error::No patch for ref ${{ env.KSU_REF }}: expected ${{ env.PATCH }}"
            ls -1 kernelsu/patches/ || true
            exit 1
          fi

      - name: Checkout KernelSU
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FLAVOR_REPO }}
          ref: ${{ env.KSU_REF }}
          path: KernelSU

      - name: Apply the Samsung patch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/KernelSU"
          git -C KernelSU apply --verbose "$GITHUB_WORKSPACE/${{ env.PATCH }}"

      - name: Build for the target release
        env:
          TARGET_RELEASE: ${{ github.event.inputs.target_release }}
        run: |
          cd KernelSU/kernel
          : "${KDIR:?the DDK image is expected to set KDIR}"

          # Read the release the DDK generated rather than assuming it, then name the target's
          # instead. `kernel.release` is what modpost stamps into vermagic; `utsrelease.h` is what
          # the module itself reports through utsname - both have to agree with the device.
          current=$(sed -n 's/.*UTS_RELEASE "\(.*\)".*/\1/p' "$KDIR/include/generated/utsrelease.h")
          echo "DDK release:    $current"
          echo "Target release: $TARGET_RELEASE"
          if [ "$current" = "$TARGET_RELEASE" ]; then
            echo "::error::The DDK already builds this release; nothing to substitute, which means the target input is probably wrong."
            exit 1
          fi
          sed -i "s#$current#$TARGET_RELEASE#g" \
            "$KDIR/include/generated/utsrelease.h" \
            "$KDIR/include/config/kernel.release"

          CONFIG_KSU=m \
          CONFIG_KSU_SAMSUNG_KDP=y \
          CONFIG_KSU_SAMSUNG_RKP=y \
          CONFIG_KSU_SAMSUNG_DEFEX=y \
          CC=clang make -j"$(nproc)"

          echo "=== vermagic must be the target's ==="
          modinfo ./kernelsu.ko | tee /tmp/modinfo.txt
          if ! grep -q "^vermagic: *$TARGET_RELEASE " /tmp/modinfo.txt; then
            echo "::error::vermagic does not start with the target release; the loader would refuse this module."
            exit 1
          fi

          llvm-strip -d kernelsu.ko

      - name: Diff the imports against the device-tested module
        env:
          TARGET_ID: ${{ github.event.inputs.target_id }}
          KMI: ${{ github.event.inputs.pair_kmi || 'android15-6.6' }}
        run: |
          # The published 3.2.5 module for this kernel build is known to load on hardware. The 3.3.0
          # module's undefined imports are compared against it: anything new is a name the device's
          # kallsyms has to carry for the loader to resolve, and is the first thing to look at if a
          # late-load refuses.
          cd KernelSU/kernel
          llvm-nm -u --format=posix kernelsu.ko | awk '{print $1}' | sort -u > /tmp/new.txt

          BASE="https://raw.githubusercontent.com/BuSung-dev/Root-My-Galaxy-Payloads/main/kernelsu"
          ok=0
          for cand in "$KMI"_kernelsu-"$TARGET_ID"-kdp.ko "$KMI"_kernelsu-s25u-kdp.ko; do
            if curl -sfL -o /tmp/base.ko "$BASE/$cand"; then
              echo "compared against: $cand"
              llvm-nm -u --format=posix /tmp/base.ko | awk '{print $1}' | sort -u > /tmp/base.txt
              ok=1
              break
            fi
          done

          echo "new module needs $(wc -l < /tmp/new.txt) imports"
          if [ "$ok" = 1 ]; then
            echo "tested module needs $(wc -l < /tmp/base.txt) imports"
            echo "=== imports the 3.3.0 module adds (not present in the tested module) ==="
            comm -23 /tmp/new.txt /tmp/base.txt | tee /tmp/added.txt
            echo "=== imports it no longer needs ==="
            comm -13 /tmp/new.txt /tmp/base.txt | head -30
            echo "added: $(wc -l < /tmp/added.txt)"
          else
            echo "::warning::could not fetch a tested module to compare against"
          fi

      - name: Name it the way the feed serves it
        env:
          TARGET_ID: ${{ github.event.inputs.target_id }}
          KMI: ${{ github.event.inputs.pair_kmi || 'android15-6.6' }}
          SUFFIX: ${{ env.FLAVOR_SUFFIX }}
        run: |
          out="${KMI}_kernelsu${SUFFIX}-${TARGET_ID}-kdp.ko"
          cp "KernelSU/kernel/kernelsu.ko" "$out"
          ls -l "$out"
          echo "size: $(stat -c %s "$out")"
          echo "sha256: $(sha256sum "$out" | cut -d' ' -f1)"

      - name: Upload the module
        uses: actions/upload-artifact@v7
        with:
          name: pair-module-${{ env.FLAVOR }}-${{ github.event.inputs.target_id }}
          # Spelled out rather than read back from $GITHUB_ENV: the `env` context in an expression is
          # filled from `env:` keys, not from what a previous step exported.
          path: ${{ github.event.inputs.pair_kmi || 'android15-6.6' }}_kernelsu${{ env.FLAVOR_SUFFIX }}-${{ github.event.inputs.target_id }}-kdp.ko
          if-no-files-found: error

  pair-ksud:
    name: pair ksud (${{ github.event.inputs.flavor || 'kernelsu' }}, ${{ github.event.inputs.target_id }})
    needs: pair-module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payloads
        uses: actions/checkout@v7

      - name: Checkout KernelSU
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FLAVOR_REPO }}
          ref: ${{ env.KSU_REF }}
          path: KernelSU
          fetch-depth: 0
          fetch-tags: true

      - name: Point the suspended Kernel-SU dependencies at KernelSU2
        run: |
          cd KernelSU
          mapfile -t manifests < <(find . -name Cargo.toml -o -name Cargo.lock | grep -v '/target/')
          echo "manifests: ${#manifests[@]}"
          sed -i 's#github\.com/Kernel-SU/#github.com/KernelSU2/#g' "${manifests[@]}"

      - name: Apply the Samsung patch
        run: git -C KernelSU apply --verbose "$GITHUB_WORKSPACE/${{ env.PATCH }}"

      - name: Show what the daemon already carries
        env:
          KMI: ${{ github.event.inputs.pair_kmi || 'android15-6.6' }}
        run: |
          # This is the step the compile-check job does not do, and the reason its `ksud` has nothing
          # to load: the daemon picks up `aarch64/<kmi>_kernelsu.ko` from its own assets at build time.
          mkdir -p KernelSU/userspace/ksud/bin/aarch64
          ls -la KernelSU/userspace/ksud/bin/aarch64/
          echo "(the above should NOT already contain a ${KMI}_kernelsu.ko)"

      - name: Download the module built for the target
        uses: actions/download-artifact@v7
        with:
          name: pair-module-${{ env.FLAVOR }}-${{ github.event.inputs.target_id }}
          path: /tmp/pair

      - name: Rust target
        run: rustup target add aarch64-linux-android

      - name: Android NDK
        run: |
          curl -sSLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-r28c" >> "$GITHUB_ENV"

      - name: libclang for bindgen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev
          clanglib=$(llvm-config --libdir 2>/dev/null || true)
          if [ -z "$clanglib" ] || [ ! -e "$clanglib/libclang.so" ]; then
            clanglib=$(dirname "$(find /usr/lib/llvm-* -name 'libclang.so*' -printf '%p\n' 2>/dev/null | head -1)")
          fi
          echo "LIBCLANG_PATH=$clanglib" >> "$GITHUB_ENV"

      - name: Cargo config for the NDK
        run: |
          if [ -f KernelSU/scripts/setup_cargo_config.py ]; then
            python3 KernelSU/scripts/setup_cargo_config.py --ndk-root "$ANDROID_NDK_HOME" --force
          else
            # See the note in the compile-check job: KernelSU-Next has no such script.
            ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
            mkdir -p KernelSU/.cargo
            cat > KernelSU/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$ndk/bin/aarch64-linux-android26-clang"

          [env]
          CC_aarch64_linux_android = "$ndk/bin/aarch64-linux-android26-clang"
          CXX_aarch64_linux_android = "$ndk/bin/aarch64-linux-android26-clang++"
          AR_aarch64_linux_android = "$ndk/bin/llvm-ar"
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "--sysroot=$ndk/sysroot -I$ndk/sysroot/usr/include/aarch64-linux-android"
          EOF
          fi

      - name: Build the daemon around it
        env:
          KMI: ${{ github.event.inputs.pair_kmi || 'android15-6.6' }}
        run: |
          dest="KernelSU/userspace/ksud/bin/aarch64/${KMI}_kernelsu.ko"
          cp "$(ls /tmp/pair/*.ko)" "$dest"
          ls -l "$dest"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd KernelSU
          cargo build --release --locked --target aarch64-linux-android -p ksud
          file target/aarch64-linux-android/release/ksud

      - name: Name it the way the feed serves it
        env:
          TARGET_ID: ${{ github.event.inputs.target_id }}
          SUFFIX: ${{ env.FLAVOR_SUFFIX }}
        run: |
          out="ksud${SUFFIX}-${TARGET_ID}-kdp"
          cp KernelSU/target/aarch64-linux-android/release/ksud "$out"
          ls -l "$out"
          # The size the feed entry has to carry.
          echo "size: $(stat -c %s "$out")"
          echo "sha256: $(sha256sum "$out" | cut -d' ' -f1)"

      - name: Upload the daemon
        uses: actions/upload-artifact@v7
        with:
          name: pair-ksud-${{ env.FLAVOR }}-${{ github.event.inputs.target_id }}
          path: ksud${{ env.FLAVOR_SUFFIX }}-${{ github.event.inputs.target_id }}-kdp
          if-no-files-found: error
